services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical-audio-postgres
    environment:
      POSTGRES_DB: clinical_audio_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: demo-password-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
